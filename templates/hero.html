<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🦸 Heroes - Multiverse Hub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&family=Montserrat:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    .hero-page {
      min-height: 100vh;
      padding-top: 80px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
    }

    .hero-header {
      text-align: center;
      padding: 3rem 2rem;
      position: relative;
    }

    .hero-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      background: linear-gradient(90deg, #fff, var(--universe-primary, #e62429));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .hero-header p {
      color: #aaa;
      font-size: 1.1rem;
    }

    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      flex-wrap: wrap;
    }

    .category-tab {
      padding: 0.8rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .category-tab:hover,
    .category-tab.active {
      background: var(--universe-primary, #e62429);
      border-color: var(--universe-primary, #e62429);
      transform: translateY(-3px);
    }

    /* Search */
    .search-container {
      position: relative;
      max-width: 500px;
      margin: 1rem auto;
      padding: 0 2rem;
    }

    .search-container i {
      position: absolute;
      left: 35px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1rem 1rem 50px;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      color: #fff;
      transition: all 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--universe-primary, #e62429);
      box-shadow: 0 0 20px var(--universe-glow, rgba(230, 36, 41, 0.3));
    }

    .search-input::placeholder {
      color: #aaa;
    }

    /* Main content */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .category-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: var(--universe-primary, #e62429);
    }

    /* Hero Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border-color: var(--universe-primary, #e62429);
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      transition: all 0.3s;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .card h3 {
      padding: 1rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: #fff;
      text-align: center;
    }

    /* Recommendations Section */
    .recommendations-section {
      margin-top: 3rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
    }

    .recommendations-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--universe-primary, #e62429);
    }

    .recommendation-reason {
      color: #aaa;
      margin-bottom: 1.5rem;
    }

    .recommendations-scroll {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      padding: 1rem 0;
      scrollbar-width: none;
    }

    .recommendations-scroll::-webkit-scrollbar {
      display: none;
    }

    .recommendation-card {
      min-width: 180px;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
    }

    .recommendation-card:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .recommendation-card img {
      width: 180px;
      height: 220px;
      object-fit: cover;
    }

    .recommendation-card-name {
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.8);
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
    }

    /* Trending Section */
    .trending-section {
      margin-top: 3rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
    }

    .trending-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #d4af37;
    }

    .trending-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .trending-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .trending-item:hover {
      transform: translateX(10px);
      background: rgba(255, 255, 255, 0.1);
    }

    .trending-rank {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      width: 50px;
      text-align: center;
    }

    .trending-rank-1 { color: gold; }
    .trending-rank-2 { color: silver; }
    .trending-rank-3 { color: #cd7f32; }

    .trending-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem;
      color: #aaa;
      font-family: 'Orbitron', sans-serif;
    }

    .no-results {
      text-align: center;
      padding: 3rem;
      color: #666;
    }

    @media (max-width: 768px) {
      .hero-header h1 {
        font-size: 2rem;
      }
      
      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      
      .category-tabs {
        gap: 0.5rem;
      }
      
      .category-tab {
        padding: 0.6rem 1rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body data-theme="dark" data-universe="marvel">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand" id="navBrand" onclick="window.location.href='/'">🌌 MULTIVERSE HUB</div>
    <button class="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/universe/marvel">Marvel</a></li>
      <li><a href="/universe/anime">Anime</a></li>
      <li><a href="/universe/telugu">Telugu</a></li>
      <li><a href="/compare">Compare</a></li>
      <li><a href="/world">World Map</a></li>
      <li><a href="/timeline">Timeline</a></li>
    </ul>
    <div class="theme-toggle dark" id="themeToggle" onclick="toggleTheme()"></div>
  </nav>

  <!-- Particles Background -->
  <div class="particles"></div>

  <!-- Main Content -->
  <div class="hero-page">
    <header class="hero-header">
      <h1 id="heroTitle">Marvel Heroes</h1>
      <p id="heroSubtitle">Explore characters from the MCU and beyond</p>
    </header>

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="category-tab active" onclick="switchCategory('marvel')">🦸 Marvel</button>
      <button class="category-tab" onclick="switchCategory('anime')">🎌 Anime</button>
      <button class="category-tab" onclick="switchCategory('telugu')">🎬 Telugu</button>
    </div>

    <!-- Search -->
    <div class="search-container">
      <i class="fas fa-search"></i>
      <input type="text" id="heroSearch" class="search-input" placeholder="Search heroes..." onkeyup="filterHeroes()">
    </div>

    <!-- Main Content -->
    <main class="container">
      <h2 class="category-title" id="categoryTitle">🦸‍♂️ MARVEL HEROES</h2>
      
      <!-- Hero Grid -->
      <div class="card-grid" id="heroGrid">
        <div class="loading">Loading heroes...</div>
      </div>

      <!-- Recommendations -->
      <div class="recommendations-section">
        <h3 class="recommendations-title">🔥 RECOMMENDED FOR YOU</h3>
        <p class="recommendation-reason" id="recommendationReason">Based on your preferences</p>
        <div class="recommendations-scroll" id="recommendationsScroll">
          <!-- Recommendations loaded via JS -->
        </div>
      </div>

      <!-- Trending -->
      <div class="trending-section">
        <h3 class="trending-title">🏆 TRENDING HEROES</h3>
        <div class="trending-list" id="trendingList">
          <!-- Trending loaded via JS -->
        </div>
      </div>
    </main>
  </div>

  <!-- Favorites Modal -->
  <div class="modal" id="favoritesModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeFavorites()">&times;</span>
      <h2 style="font-family: 'Orbitron', sans-serif; margin-bottom: 1rem;">❤️ My Favorites</h2>
      <div class="card-grid" id="favoritesGrid"></div>
    </div>
  </div>

  <!-- Reality Shift Overlay -->
  <div class="reality-shift" id="realityShift"></div>

  <script src="/static/js/main.js"></script>
  <script>
    // Category configuration
    const CATEGORY_CONFIG = {
      marvel: {
        title: 'Marvel Heroes',
        subtitle: 'Explore characters from the MCU and beyond',
        brand: '🦸‍♂️ MARVEL',
        color: '#e62429'
      },
      anime: {
        title: 'Anime Heroes',
        subtitle: 'Explore characters from popular anime series',
        brand: '🎌 ANIME',
        color: '#1e90ff'
      },
      telugu: {
        title: 'Telugu Cinema',
        subtitle: 'Explore legendary Telugu film actors',
        brand: '🎬 TELUGU',
        color: '#d4af37'
      }
    };

    let currentCategory = 'marvel';
    let allHeroes = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      createParticles();
      loadHeroes();
      displayRecommendations();
      loadTrendingHeroes();
    });

    async function loadHeroes() {
      const grid = document.getElementById('heroGrid');
      grid.innerHTML = '<div class="loading">Loading heroes...</div>';
      
      try {
        const response = await fetch(`/category-heroes/${currentCategory}`, {
          credentials: 'include'
        });
        const heroes = await response.json();
        allHeroes = heroes;
        
        if (heroes.length === 0) {
          grid.innerHTML = '<div class="no-results">No heroes found</div>';
          return;
        }
        
        grid.innerHTML = heroes.map(hero => {
          const slug = hero.name.toLowerCase().replace(/\s+/g, '-');
          return `
            <article class="card" onclick="navigateToHero('${hero.name}')">
              <img src="${hero.image}" alt="${hero.name}" loading="lazy" onerror="this.src='/static/assets/Iron-Man.jpg'">
              <h3>${hero.name}</h3>
            </article>
          `;
        }).join('');
      } catch (error) {
        console.error('Error loading heroes:', error);
        grid.innerHTML = '<div class="error">Error loading heroes</div>';
      }
    }

    async function switchCategory(category) {
      currentCategory = category;
      const config = CATEGORY_CONFIG[category];
      
      // Update UI
      document.getElementById('navBrand').textContent = config.brand;
      document.getElementById('heroTitle').textContent = config.title;
      document.getElementById('heroSubtitle').textContent = config.subtitle;
      document.getElementById('categoryTitle').textContent = category === 'marvel' ? '🦸‍♂️ MARVEL HEROES' : category === 'anime' ? '🎌 ANIME HEROES' : '🎬 TELUGU HEROES';
      document.getElementById('categoryTitle').style.color = config.color;
      
      // Update tabs
      document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      
      // Apply theme color
      document.documentElement.style.setProperty('--universe-primary', config.color);
      document.documentElement.style.setProperty('--universe-glow', config.color + '99');
      document.body.setAttribute('data-universe', category);
      
      // Trigger reality shift
      triggerRealityShift(category);
      
      // Load heroes
      await loadHeroes();
    }

    async function filterHeroes() {
      const query = document.getElementById('heroSearch').value.toLowerCase();
      const grid = document.getElementById('heroGrid');
      
      if (!query) {
        await loadHeroes();
        return;
      }
      
      const filtered = allHeroes.filter(hero => 
        hero.name.toLowerCase().includes(query)
      );
      
      grid.innerHTML = filtered.map(hero => {
        const slug = hero.name.toLowerCase().replace(/\s+/g, '-');
        return `
          <article class="card" onclick="navigateToHero('${hero.name}')">
            <img src="${hero.image}" alt="${hero.name}" loading="lazy" onerror="this.src='/static/assets/Iron-Man.jpg'">
            <h3>${hero.name}</h3>
          </article>
        `;
      }).join('');
    }

    // Favorites
    function showFavorites() {
      fetch('/favorites')
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            alert('Please login first');
            return;
          }
          
          const grid = document.getElementById('favoritesGrid');
          if (data.favorites.length === 0) {
            grid.innerHTML = '<p style="text-align: center; color: #aaa;">No favorites yet!</p>';
          } else {
            grid.innerHTML = data.favorites.map(hero => {
              const slug = hero.toLowerCase().replace(/\s+/g, '-');
              return `
                <article class="card" onclick="navigateToHero('${hero}')">
                  <img src="/static/assets/${getHeroImage(hero)}" alt="${hero}" onerror="this.src='/static/assets/Iron-Man.jpg'">
                  <h3>${hero}</h3>
                </article>
              `;
            }).join('');
          }
          
          document.getElementById('favoritesModal').classList.add('active');
        });
    }

    function closeFavorites() {
      document.getElementById('favoritesModal').classList.remove('active');
    }

    function getHeroImage(heroName) {
      const map = {
        'Iron Man': 'Iron-Man.jpg',
        'Captain America': 'captain america.jpg',
        'Thor': 'thor.jpg',
        'Hulk': 'hulk.jpg',
        'Spider-Man': 'spider-man.jpg',
        'Black Panther': 'black panther.jpg',
        'Thanos': 'thanos.jpg',
        'Loki': 'loki.jpg',
        'Deadpool': 'deapool.jpg',
        'Wolverine': 'wolverine.jpg'
      };
      return map[heroName] || `${heroName.toLowerCase().replace(/ /g, '-')}.jpg`;
    }

    function handleLogout() {
      fetch('/logout', { method: 'POST' })
        .then(() => window.location.href = '/');
    }
  </script>
</body>
</html>
